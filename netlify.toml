[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback. /api/* is served by functions (declared via their own
# `config.path`), which take precedence over redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
